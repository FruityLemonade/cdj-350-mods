name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [emulator-updated]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: FruityLemonade/cdj-850-emulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.sync.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync tools and check for CDJ-350 ports
        id: sync
        shell: bash
        run: |
          result=$(python3 sync_vendor.py upstream | tee /dev/stderr | tail -n 1)
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            exit 0
          fi
          if [ "$result" = changed ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A vendor
            git commit -m "Sync tools from cdj-850-emulator@$(cut -c1-7 vendor/UPSTREAM)"
            git push origin HEAD:main
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Cache the SH-2A toolchain
        id: sh-toolchain
        if: steps.sync.outputs.publish == 'true' || github.ref != 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: upstream/tools/sh-elf
          key: sh-elf-${{ runner.os }}-${{ hashFiles('upstream/scripts/build/sh_elf_toolchain.sh') }}
      - name: Build the SH-2A toolchain
        if: (steps.sync.outputs.publish == 'true' || github.ref != 'refs/heads/main') && steps.sh-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential zlib1g-dev
          upstream/scripts/build/sh_elf_toolchain.sh
      - name: Build the site
        if: steps.sync.outputs.publish == 'true' || github.ref != 'refs/heads/main'
        env:
          CDJ850_SH_ELF: ${{ github.workspace }}/upstream/tools/sh-elf/bin/sh-elf-
          PATCH_COUNTER_URL: ${{ vars.PATCH_COUNTER_URL }}
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v4
        if: steps.sync.outputs.publish == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
